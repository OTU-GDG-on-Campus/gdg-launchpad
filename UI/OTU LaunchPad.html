document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

position:relative;aspect-ratio:16/10\"><div style=\"{{ p.art }}\"><\u002Fdiv><\u002Fdiv>\n            <div style=\"padding:18px\">\n              <div style=\"font-size:17.5px;font-weight:700;letter-spacing:-.015em;color:#10151B\">{{ p.title }}<\u002Fdiv>\n              <div style=\"font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:#55606C;margin-top:8px\">{{ p.tagline }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fbutton>\n        <\u002Farticle>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fsection>\n  <section style=\"max-width:1160px;margin:0 auto;padding:20px clamp(24px,4vw,44px) 96px\">\n    <sc-for list=\"{{ sp.sections }}\" as=\"s\" hint-placeholder-count=\"4\">\n      <div style=\"display:grid;grid-template-columns:minmax(0,190px) minmax(0,1fr);gap:40px;padding:34px 0;border-bottom:1px solid #EFEDE7\">\n        <div style=\"font-family:'IBM Plex Mono',monospace;font-size:11.5px;letter-spacing:.09em;color:#00417A;padding-top:4px\">{{ s.label }}<\u002Fdiv>\n        <div>\n          <sc-if value=\"{{ s.isText }}\" hint-placeholder-val=\"{{ true }}\">\n            <p style=\"margin:0;font-size:16.5px;line-height:1.65;color:#22303D;max-width:66ch\">{{ s.body }}<\u002Fp>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ s.isTags }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"display:flex;flex-wrap:wrap;gap:9px\">\n              <sc-for list=\"{{ s.items }}\" as=\"t\" hint-placeholder-count=\"5\">\n                <span style=\"border:1px solid #D9E3EE;background:#F2F7FC;color:#00417A;border-radius:7px;padding:7px 13px;font-family:'IBM Plex Mono',monospace;font-size:12.5px\">{{ t }}<\u002Fspan>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ s.isList }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"display:flex;flex-direction:column;gap:14px\">\n              <sc-for list=\"{{ s.entries }}\" as=\"e\" hint-placeholder-count=\"3\">\n                <div>\n                  <div style=\"font-size:16px;font-weight:700\">{{ e.title }}<\u002Fdiv>\n                  <div style=\"font-size:14.5px;color:#3D4855;margin-top:3px\">{{ e.detail }}<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-for>\n  <\u002Fsection>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<!-- ══════════ SPRINTS ══════════ -->\n<sc-if value=\"{{ isSprints }}\" hint-placeholder-val=\"{{ false }}\">\n<div>\n  <section style=\"position:relative;overflow:hidden;border-bottom:1px solid #E6E4DE;background-color:#FDFDFC;background-image:linear-gradient(rgba(0,65,122,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(0,65,122,.05) 1px,transparent 1px),linear-gradient(rgba(0,65,122,.085) 1px,transparent 1px),linear-gradient(90deg,rgba(0,65,122,.085) 1px,transparent 1px);background-size:24px 24px,24px 24px,120px 120px,120px 120px\">\n    <svg aria-hidden=\"true\" width=\"200\" height=\"200\" sc-camel-view-box=\"0 0 100 100\" fill=\"none\" stroke=\"#E2572A\" stroke-width=\"1.2\" style=\"position:absolute;right:6%;top:48px;opacity:.3\">\n      <path d=\"M50 12c9 10 13 22 13 33l7 9v10l-11-5H41l-11 5V54l7-9c0-11 4-23 13-33Z\"><\u002Fpath><circle cx=\"50\" cy=\"40\" r=\"5\"><\u002Fcircle><path d=\"M44 74l-4 12M56 74l4 12M50 76v14\"><\u002Fpath>\n    <\u002Fsvg>\n    <div style=\"position:relative;max-width:1340px;margin:0 auto;padding:72px clamp(24px,4vw,44px) 60px\">\n      <h1 style=\"margin:0;font-size:clamp(38px,5vw,64px);letter-spacing:-.035em;font-weight:800;max-width:15ch\">Build something this semester.<\u002Fh1>\n      <p style=\"margin:18px 0 0;max-width:54ch;font-size:18.5px;line-height:1.55;color:#3D4855\">Turn your ideas into software, side-by-side with your peers.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fsection>\n  <section style=\"max-width:1340px;margin:0 auto;padding:44px clamp(24px,4vw,44px) 0\">\n    <div style=\"border:1px solid #E6E4DE;border-radius:14px;overflow:hidden;background:#00417A;color:#fff\">\n      <div style=\"padding:46px 44px;background-image:linear-gradient(rgba(255,255,255,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.07) 1px,transparent 1px);background-size:30px 30px\">\n        <div style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.12em;color:#FFB893\">FALL 2026<\u002Fdiv>\n        <h2 style=\"margin:14px 0 0;font-size:clamp(34px,5vw,60px);letter-spacing:-.04em;font-weight:800\">Build for Campus<\u002Fh2>\n        <div style=\"font-family:'IBM Plex Mono',monospace;font-size:13px;letter-spacing:.06em;color:rgba(255,255,255,.82);margin-top:18px\">14 DAYS · 87 BUILDERS · 31 PROJECTS<\u002Fdiv>\n        <div style=\"display:flex;gap:14px;flex-wrap:wrap;margin-top:30px\">\n          <sc-for list=\"{{ countdown }}\" as=\"c\" hint-placeholder-count=\"4\">\n            <div style=\"background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);border-radius:10px;padding:14px 20px;min-width:92px;text-align:center\">\n              <div style=\"font-family:'IBM Plex Mono',monospace;font-size:30px;font-weight:500\">{{ c.value }}<\u002Fdiv>\n              <div style=\"font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.1em;color:rgba(255,255,255,.7);margin-top:4px\">{{ c.label }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <button sc-camel-on-click=\"{{ joinSprint }}\" style=\"margin-top:32px;background:#E2572A;color:#fff;border:0;border-radius:9px;padding:15px 30px;font-size:15.5px;font-weight:700;cursor:pointer\" style-hover=\"background:#C4461D\">{{ joinLabel }}<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n  <section style=\"max-width:1340px;margin:0 auto;padding:80px clamp(24px,4vw,44px) 0\">\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:48px\">\n      <div>\n        <h2 style=\"margin:0;font-size:32px;font-weight:800;letter-spacing:-.03em\">What are Semester Sprints?<\u002Fh2>\n        <p style=\"margin:16px 0 0;font-size:17px;line-height:1.65;color:#22303D\">Two weeks, one theme, and as many students as want to join. Sprints are student-run: you form an idea, build it alongside peers in the same room or the same Discord, and demo it at the end. Nothing is graded and nothing is submitted to a professor.<\u002Fp>\n      <\u002Fdiv>\n      <div>\n        <h2 style=\"margin:0;font-size:32px;font-weight:800;letter-spacing:-.03em\">Why join one?<\u002Fh2>\n        <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:20px\">\n          <sc-for list=\"{{ sprintWhy }}\" as=\"w\" hint-placeholder-count=\"4\">\n            <div style=\"border:1px solid #E6E4DE;border-radius:10px;background:#fff;padding:18px\">\n              <div style=\"font-size:15.5px;font-weight:700\">{{ w.title }}<\u002Fdiv>\n              <div style=\"font-size:13.5px;color:#3D4855;margin-top:6px;line-height:1.5\">{{ w.body }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n  <section style=\"max-width:1340px;margin:0 auto;padding:72px clamp(24px,4vw,44px) 0\">\n    <h2 style=\"margin:0 0 28px;font-size:32px;font-weight:800;letter-spacing:-.03em\">How sprints work<\u002Fh2>\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:2px;background:#E6E4DE;border:1px solid #E6E4DE;border-radius:12px;overflow:hidden\">\n      <sc-for list=\"{{ sprintSteps }}\" as=\"s\" hint-placeholder-count=\"4\">\n        <div style=\"background:#fff;padding:28px 26px\">\n          <div style=\"font-family:'IBM Plex Mono',monospace;font-size:13px;color:#E2572A\">{{ s.num }}<\u002Fdiv>\n          <div style=\"font-size:19px;font-weight:700;margin-top:12px;letter-spacing:-.02em\">{{ s.title }}<\u002Fdiv>\n          <div style=\"font-size:14.5px;color:#3D4855;margin-top:8px;line-height:1.55\">{{ s.body }}<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fsection>\n  <section style=\"max-width:1340px;margin:0 auto;padding:72px clamp(24px,4vw,44px) 96px\">\n    <h2 style=\"margin:0 0 24px;font-size:32px;font-weight:800;letter-spacing:-.03em\">Sprint history<\u002Fh2>\n    <div style=\"border:1px solid #E6E4DE;border-radius:12px;overflow:hidden;background:#fff\">\n      <sc-for list=\"{{ sprintHistory }}\" as=\"h\" hint-placeholder-count=\"4\">\n        <button sc-camel-on-click=\"{{ h.open }}\" style=\"display:flex;align-items:center;gap:20px;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid #F1EFE9;padding:22px 26px;cursor:pointer\" style-hover=\"background:#FAF9F5\">\n          <span style=\"font-family:'IBM Plex Mono',monospace;font-size:13px;color:#00417A;width:110px;flex:none\">{{ h.term }}<\u002Fspan>\n          <span style=\"font-size:17px;font-weight:700;flex:1\">{{ h.theme }}<\u002Fspan>\n          <span style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;color:#55606C\">{{ h.meta }}<\u002Fspan>\n          <span style=\"color:#3D4855\">→<\u002Fspan>\n        <\u002Fbutton>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fsection>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<!-- ══════════ SUBMIT ══════════ -->\n<sc-if value=\"{{ isSubmit }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"max-width:940px;margin:0 auto;padding:48px clamp(24px,4vw,44px) 96px\">\n  <div style=\"font-family:'IBM Plex Mono',monospace;font-size:11.5px;letter-spacing:.09em;color:#55606C\">NEW PROJECT · STEP {{ stepNum }} OF 6<\u002Fdiv>\n  <h1 style=\"margin:14px 0 0;font-size:clamp(32px,4.2vw,46px);letter-spacing:-.035em;font-weight:800\">{{ stepTitle }}<\u002Fh1>\n  <div style=\"display:flex;gap:6px;margin-top:28px\">\n    <sc-for list=\"{{ steps }}\" as=\"s\" hint-placeholder-count=\"6\">\n      <button sc-camel-on-click=\"{{ s.go }}\" aria-label=\"{{ s.aria }}\" style=\"flex:1;text-align:left;background:none;border:0;padding:0;cursor:pointer\">\n        <span style=\"display:block;height:4px;border-radius:99px;background:{{ s.bar }}\"><\u002Fspan>\n        <span style=\"display:block;font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:{{ s.fg }};margin-top:8px\">{{ s.label }}<\u002Fspan>\n      <\u002Fbutton>\n    <\u002Fsc-for>\n  <\u002Fdiv>\n\n  <div style=\"margin-top:38px;border:1px solid #E6E4DE;border-radius:14px;background:#fff;padding:36px\">\n    <sc-for list=\"{{ stepFields }}\" as=\"f\" hint-placeholder-count=\"3\">\n      <div style=\"margin-bottom:24px\">\n        <label style=\"display:block;font-size:14.5px;font-weight:700;margin-bottom:8px\">{{ f.label }}<\u002Flabel>\n        <sc-if value=\"{{ f.isInput }}\" hint-placeholder-val=\"{{ true }}\">\n          <input value=\"{{ f.value }}\" sc-camel-on-change=\"{{ f.set }}\" placeholder=\"{{ f.placeholder }}\" style=\"width:100%;border:1px solid #D9D6CE;border-radius:9px;padding:13px 14px;font-size:15px;outline:none;background:#FCFCFA\" style-focus=\"border-color:#00417A\">\n        <\u002Fsc-if>\n        <sc-if value=\"{{ f.isArea }}\" hint-placeholder-val=\"{{ false }}\">\n          <textarea value=\"{{ f.value }}\" sc-camel-on-change=\"{{ f.set }}\" placeholder=\"{{ f.placeholder }}\" rows=\"4\" style=\"width:100%;border:1px solid #D9D6CE;border-radius:9px;padding:13px 14px;font-size:15px;outline:none;background:#FCFCFA;resize:vertical;line-height:1.55\" style-focus=\"border-color:#00417A\"><\u002Ftextarea>\n        <\u002Fsc-if>\n        <sc-if value=\"{{ f.isSelect }}\" hint-placeholder-val=\"{{ false }}\">\n          <sc-raw-select value=\"{{ f.value }}\" sc-camel-on-change=\"{{ f.set }}\" style=\"width:100%;border:1px solid #D9D6CE;border-radius:9px;padding:13px 14px;font-size:15px;background:#FCFCFA;cursor:pointer\">\n            <sc-for list=\"{{ f.options }}\" as=\"o\" hint-placeholder-count=\"3\">\n              <option value=\"{{ o }}\">{{ o }}<\u002Foption>\n            <\u002Fsc-for>\n          <\u002Fsc-raw-select>\n        <\u002Fsc-if>\n        <sc-if value=\"{{ f.isToggle }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"display:flex;gap:10px\">\n            <sc-for list=\"{{ f.choices }}\" as=\"c\" hint-placeholder-count=\"2\">\n              <button sc-camel-on-click=\"{{ c.set }}\" aria-pressed=\"{{ c.on }}\" style=\"border:1px solid {{ c.border }};background:{{ c.bg }};color:{{ c.fg }};border-radius:9px;padding:11px 24px;font-size:14.5px;font-weight:700;cursor:pointer\">{{ c.label }}<\u002Fbutton>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n        <sc-if value=\"{{ f.hasHint }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"font-size:13px;color:#55606C;margin-top:7px\">{{ f.hint }}<\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n    <\u002Fsc-for>\n\n    <sc-if value=\"{{ isPreviewStep }}\" hint-placeholder-val=\"{{ false }}\">\n      <div>\n        <div style=\"border:1px solid #E6E4DE;border-radius:12px;overflow:hidden\">\n          <div style=\"position:relative;aspect-ratio:2/1\"><div style=\"{{ previewArt }}\"><\u002Fdiv><\u002Fdiv>\n          <div style=\"padding:26px\">\n            <h2 style=\"margin:0;font-size:30px;font-weight:800;letter-spacing:-.03em\">{{ previewTitle }}<\u002Fh2>\n            <p style=\"margin:12px 0 0;font-size:16.5px;line-height:1.6;color:#3D4855\">{{ previewDesc }}<\u002Fp>\n            <div style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;color:#55606C;margin-top:16px\">{{ previewStack }}<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"margin-top:20px;border:1px solid #D9E3EE;background:#F2F7FC;border-radius:10px;padding:16px 18px;font-size:14px;color:#22303D;line-height:1.55\">Submitted projects are reviewed by a moderator before they appear publicly. You'll get a notification when the review is done.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <div style=\"display:flex;gap:10px;margin-top:8px;padding-top:24px;border-top:1px solid #F1EFE9\">\n      <button sc-camel-on-click=\"{{ prevStep }}\" disabled=\"{{ atFirstStep }}\" style=\"background:#fff;border:1px solid #D9D6CE;border-radius:9px;padding:13px 22px;font-size:14.5px;font-weight:700;color:{{ backFg }};cursor:pointer\">Back<\u002Fbutton>\n      <div style=\"flex:1\"><\u002Fdiv>\n      <button sc-camel-on-click=\"{{ saveDraft }}\" style=\"background:none;border:0;padding:13px 16px;font-size:14.5px;font-weight:700;color:#3D4855;cursor:pointer\" style-hover=\"color:#00417A\">Save draft<\u002Fbutton>\n      <button sc-camel-on-click=\"{{ nextStep }}\" style=\"background:#00417A;color:#fff;border:0;border-radius:9px;padding:13px 26px;font-size:14.5px;font-weight:700;cursor:pointer\" style-hover=\"background:#002C52\">{{ nextLabel }}<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<!-- ══════════ DASHBOARD ══════════ -->\n<sc-if value=\"{{ isDashboard }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"max-width:1340px;margin:0 auto;padding:52px clamp(24px,4vw,44px) 96px\">\n  <h1 style=\"margin:0;font-size:clamp(32px,4.2vw,46px);letter-spacing:-.035em;font-weight:800\">Welcome back, {{ meFirst }}<\u002Fh1>\n  <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:2px;margin-top:32px;background:#E6E4DE;border:1px solid #E6E4DE;border-radius:12px;overflow:hidden\">\n    <sc-for list=\"{{ dashStats }}\" as=\"s\" hint-placeholder-count=\"3\">\n      <div style=\"background:#fff;padding:26px 28px\">\n        <div style=\"font-size:38px;font-weight:800;letter-spacing:-.04em\">{{ s.value }}<\u002Fdiv>\n        <div style=\"font-family:'IBM Plex Mono',monospace;font-size:11.5px;letter-spacing:.08em;color:#55606C;margin-top:6px\">{{ s.label }}<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-for>\n  <\u002Fdiv>\n  <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:26px;margin-top:38px\">\n    <div>\n      <div style=\"display:flex;align-items:center;justify-content:space-between;margin-bottom:16px\">\n        <h2 style=\"margin:0;font-size:24px;font-weight:800;letter-spacing:-.025em\">My Projects<\u002Fh2>\n        <button sc-camel-on-click=\"{{ goSubmit }}\" style=\"background:#00417A;color:#fff;border:0;border-radius:8px;padding:9px 16px;font-size:13.5px;font-weight:700;cursor:pointer\">New project<\u002Fbutton>\n      <\u002Fdiv>\n      <div style=\"border:1px solid #E6E4DE;border-radius:12px;background:#fff;overflow:hidden\">\n        <sc-for list=\"{{ myProjects }}\" as=\"p\" hint-placeholder-count=\"4\">\n          <div style=\"display:flex;align-items:center;gap:14px;padding:18px 20px;border-bottom:1px solid #F1EFE9\">\n            <div style=\"width:52px;height:38px;border-radius:6px;overflow:hidden;flex:none;position:relative\"><div style=\"{{ p.art }}\"><\u002Fdiv><\u002Fdiv>\n            <div style=\"flex:1;min-width:0\">\n              <div style=\"font-size:15.5px;font-weight:700\">{{ p.title }}<\u002Fdiv>\n              <div style=\"font-family:'IBM Plex Mono',monospace;font-size:11px;color:#55606C;margin-top:3px\">{{ p.meta }}<\u002Fdiv>\n            <\u002Fdiv>\n            <span style=\"background:{{ p.statusBg }};color:{{ p.statusFg }};border-radius:6px;padding:5px 10px;font-size:12px;font-weight:700;white-space:nowrap\">{{ p.status }}<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div>\n      <h2 style=\"margin:0 0 16px;font-size:24px;font-weight:800;letter-spacing:-.025em\">Collaboration requests<\u002Fh2>\n      <div style=\"border:1px solid #E6E4DE;border-radius:12px;background:#fff;overflow:hidden;margin-bottom:26px\">\n        <sc-for list=\"{{ collabRequests }}\" as=\"c\" hint-placeholder-count=\"2\">\n          <div style=\"padding:18px 20px;border-bottom:1px solid #F1EFE9\">\n            <div style=\"font-size:15px;font-weight:700\">{{ c.name }}<\u002Fdiv>\n            <div style=\"font-size:13.5px;color:#3D4855;margin-top:4px;line-height:1.5\">{{ c.body }}<\u002Fdiv>\n            <div style=\"display:flex;gap:8px;margin-top:12px\">\n              <button style=\"background:#00417A;color:#fff;border:0;border-radius:7px;padding:7px 14px;font-size:12.5px;font-weight:700;cursor:pointer\">Accept<\u002Fbutton>\n              <button style=\"background:#fff;border:1px solid #D9D6CE;border-radius:7px;padding:7px 14px;font-size:12.5px;font-weight:700;color:#3D4855;cursor:pointer\">Decline<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <h2 style=\"margin:0 0 16px;font-size:24px;font-weight:800;letter-spacing:-.025em\">Notifications<\u002Fh2>\n      <div style=\"border:1px solid #E6E4DE;border-radius:12px;background:#fff;overflow:hidden\">\n        <sc-for list=\"{{ notifications }}\" as=\"n\" hint-placeholder-count=\"4\">\n          <div style=\"padding:15px 20px;border-bottom:1px solid #F1EFE9\">\n            <div style=\"font-size:14.5px;font-weight:600\">{{ n.title }}<\u002Fdiv>\n            <div style=\"font-family:'IBM Plex Mono',monospace;font-size:11px;color:#5A6470;margin-top:4px\">{{ n.when }}<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<!-- ══════════ ADMIN ══════════ -->\n<sc-if value=\"{{ isAdmin }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"max-width:1340px;margin:0 auto;padding:52px clamp(24px,4vw,44px) 96px\">\n  <sc-if value=\"{{ adminDenied }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"border:1px solid #E6C9BC;background:#FDF4F0;border-radius:14px;padding:64px 40px;text-align:center;max-width:620px;margin:40px auto\">\n      <svg aria-hidden=\"true\" width=\"52\" height=\"52\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#A83B15\" stroke-width=\"1.5\" style=\"margin-bottom:8px\"><rect x=\"4\" y=\"10\" width=\"16\" height=\"10\" rx=\"2\"><\u002Frect><path d=\"M8 10V7a4 4 0 0 1 8 0v3\"><\u002Fpath><\u002Fsvg>\n      <h1 style=\"margin:14px 0 0;font-size:28px;font-weight:800;letter-spacing:-.025em\">Moderator access required<\u002Fh1>\n      <p style=\"margin:12px 0 0;font-size:15.5px;line-height:1.6;color:#22303D\">This route is gated server-side by role. Your session is <strong>{{ meRole }}<\u002Fstrong>. Switch the demo role in the account menu to preview the admin experience.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n  <sc-if value=\"{{ adminAllowed }}\" hint-placeholder-val=\"{{ true }}\">\n  <div>\n    <div style=\"display:flex;align-items:center;gap:12px\">\n      <h1 style=\"margin:0;font-size:clamp(30px,4vw,42px);letter-spacing:-.035em;font-weight:800\">Admin<\u002Fh1>\n      <span style=\"font-family:'IBM Plex Mono',monospace;font-size:11px;background:#10151B;color:#fff;border-radius:6px;padding:5px 9px\">{{ meRole }}<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:2px;margin-top:28px;background:#E6E4DE;border:1px solid #E6E4DE;border-radius:12px;overflow:hidden\">\n      <sc-for list=\"{{ adminStats }}\" as=\"s\" hint-placeholder-count=\"4\">\n        <div style=\"background:#fff;padding:24px 26px\">\n          <div style=\"font-size:34px;font-weight:800;letter-spacing:-.04em;color:{{ s.color }}\">{{ s.value }}<\u002Fdiv>\n          <div style=\"font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.08em;color:#55606C;margin-top:6px\">{{ s.label }}<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n    <h2 style=\"margin:40px 0 16px;font-size:24px;font-weight:800;letter-spacing:-.025em\">Review queue<\u002Fh2>\n    <div style=\"border:1px solid #E6E4DE;border-radius:12px;background:#fff;overflow:hidden\">\n      <sc-for list=\"{{ queue }}\" as=\"q\" hint-placeholder-count=\"3\">\n        <div style=\"padding:20px 22px;border-bottom:1px solid #F1EFE9;display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap\">\n          <div style=\"width:74px;height:52px;border-radius:7px;overflow:hidden;flex:none;position:relative\"><div style=\"{{ q.art }}\"><\u002Fdiv><\u002Fdiv>\n          <div style=\"flex:1;min-width:220px\">\n            <div style=\"font-size:16.5px;font-weight:700\">{{ q.title }}<\u002Fdiv>\n            <div style=\"font-size:13.5px;color:#3D4855;margin-top:4px\">{{ q.author }} · {{ q.program }}<\u002Fdiv>\n            <div style=\"font-family:'IBM Plex Mono',monospace;font-size:11px;color:#5A6470;margin-top:6px\">{{ q.submitted }}<\u002Fdiv>\n            <sc-if value=\"{{ q.flagged }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"margin-top:8px;display:inline-flex;background:#FDEFE9;color:#A83B15;border-radius:6px;padding:4px 9px;font-size:12px;font-weight:700\">{{ q.flag }}<\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n          <div style=\"display:flex;gap:7px;flex-wrap:wrap\">\n            <sc-for list=\"{{ q.actions }}\" as=\"a\" hint-placeholder-count=\"4\">\n              <button sc-camel-on-click=\"{{ a.run }}\" style=\"background:{{ a.bg }};color:{{ a.fg }};border:1px solid {{ a.border }};border-radius:7px;padding:8px 13px;font-size:12.5px;font-weight:700;cursor:pointer\" style-hover=\"border-color:#00417A\">{{ a.label }}<\u002Fbutton>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n    <h2 style=\"margin:40px 0 16px;font-size:24px;font-weight:800;letter-spacing:-.025em\">Audit log<\u002Fh2>\n    <div style=\"border:1px solid #E6E4DE;border-radius:12px;background:#fff;overflow:hidden;font-family:'IBM Plex Mono',monospace\">\n      <sc-for list=\"{{ auditLog }}\" as=\"l\" hint-placeholder-count=\"4\">\n        <div style=\"display:flex;gap:18px;padding:13px 22px;border-bottom:1px solid #F1EFE9;font-size:12px;color:#22303D;flex-wrap:wrap\">\n          <span style=\"color:#5A6470;width:130px;flex:none\">{{ l.when }}<\u002Fspan>\n          <span style=\"color:#00417A;width:110px;flex:none\">{{ l.actor }}<\u002Fspan>\n          <span style=\"flex:1\">{{ l.action }}<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <\u002Fsc-if>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<!-- ══════════ ABOUT ══════════ -->\n<sc-if value=\"{{ isAbout }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"max-width:860px;margin:0 auto;padding:72px clamp(24px,4vw,44px) 110px\">\n  <h1 style=\"margin:0;font-size:clamp(36px,5vw,58px);letter-spacing:-.035em;font-weight:800;max-width:16ch\">A place for the things you built anyway.<\u002Fh1>\n  <p style=\"margin:24px 0 0;font-size:19px;line-height:1.65;color:#22303D;max-width:66ch\">OTU LaunchPad collects the work Ontario Tech students do outside of coursework. The hackathon project, the tool you wrote to fix your own problem, the game you finished over reading week. Work that usually ends up on a laptop and stays there.<\u002Fp>\n  <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:2px;margin-top:48px;background:#E6E4DE;border:1px solid #E6E4DE;border-radius:12px;overflow:hidden\">\n    <sc-for list=\"{{ aboutPoints }}\" as=\"a\" hint-placeholder-count=\"3\">\n      <div style=\"background:#fff;padding:28px\">\n        <div style=\"font-size:18px;font-weight:700;letter-spacing:-.02em\">{{ a.title }}<\u002Fdiv>\n        <div style=\"font-size:14.5px;color:#3D4855;margin-top:9px;line-height:1.6\">{{ a.body }}<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-for>\n  <\u002Fdiv>\n  <h2 style=\"margin:56px 0 0;font-size:30px;font-weight:800;letter-spacing:-.03em\">Contribute<\u002Fh2>\n  <p style=\"margin:14px 0 0;font-size:17px;line-height:1.65;color:#22303D;max-width:66ch\">LaunchPad is built and maintained by students. Design, frontend, backend, moderation, or sprint organizing — there's room. Open an issue on the repo or come to a sprint kickoff.<\u002Fp>\n  <div style=\"display:flex;gap:10px;margin-top:24px;flex-wrap:wrap\">\n    <a href=\"#\" style=\"background:#00417A;color:#fff;border-radius:9px;padding:14px 26px;font-size:15px;font-weight:700\">View the repo<\u002Fa>\n    <button sc-camel-on-click=\"{{ goSprints }}\" style=\"background:#fff;border:1px solid #D9D6CE;border-radius:9px;padding:14px 26px;font-size:15px;font-weight:700;cursor:pointer\">Join a sprint<\u002Fbutton>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<\u002Fmain>\n\n<footer style=\"border-top:1px solid #E6E4DE;background:#F3F2ED\">\n  <div style=\"max-width:1340px;margin:0 auto;padding:60px clamp(24px,4vw,44px) 44px;display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:40px\">\n    <div>\n      <div style=\"font-size:18px;font-weight:800;letter-spacing:-.02em\"><span style=\"color:#00417A\">OTU<\u002Fspan> <span style=\"color:#E2572A\">Launch<\u002Fspan><span style=\"color:#10151B\">Pad.<\u002Fspan><\u002Fdiv>\n      <div style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;color:#55606C;margin-top:10px\">Build. Share. Launch.<\u002Fdiv>\n    <\u002Fdiv>\n    <sc-for list=\"{{ footerCols }}\" as=\"c\" hint-placeholder-count=\"3\">\n      <div>\n        <div style=\"font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.09em;color:#55606C\">{{ c.title }}<\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:10px;margin-top:14px;align-items:flex-start\">\n          <sc-for list=\"{{ c.links }}\" as=\"l\" hint-placeholder-count=\"4\">\n            <button sc-camel-on-click=\"{{ l.go }}\" style=\"background:none;border:0;padding:0;cursor:pointer;font-size:14px;font-weight:600;color:#3D4855\" style-hover=\"color:#00417A\">{{ l.label }}<\u002Fbutton>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-for>\n  <\u002Fdiv>\n  <div style=\"max-width:1340px;margin:0 auto;padding:0 clamp(24px,4vw,44px) 40px;font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:#5A6470\">© 2026 OTU LAUNCHPAD · A STUDENT-RUN PROJECT AT ONTARIO TECH UNIVERSITY<\u002Fdiv>\n<\u002Ffooter>\n\n<sc-if value=\"{{ loginOpen }}\" hint-placeholder-val=\"{{ false }}\">\n  <div style=\"position:fixed;inset:0;z-index:90;background:rgba(16,21,27,.42);display:grid;place-items:center;padding:24px\">\n    <div role=\"dialog\" aria-modal=\"true\" aria-label=\"Sign in\" style=\"width:100%;max-width:420px;background:#fff;border:1px solid #E6E4DE;border-radius:14px;padding:34px;animation:otuRise .22s ease-out\">\n      <div style=\"font-size:19px;font-weight:800;letter-spacing:-.02em\"><span style=\"color:#00417A\">OTU<\u002Fspan> <span style=\"color:#E2572A\">Launch<\u002Fspan><span style=\"color:#10151B\">Pad.<\u002Fspan><\u002Fdiv>\n      <h2 style=\"margin:20px 0 0;font-size:25px;font-weight:800;letter-spacing:-.025em\">Sign in to LaunchPad<\u002Fh2>\n      <p style=\"margin:10px 0 0;font-size:14.5px;line-height:1.55;color:#3D4855\">Use your Ontario Tech Google account. Domain eligibility is verified server-side on every request.<\u002Fp>\n      <button sc-camel-on-click=\"{{ doLogin }}\" style=\"width:100%;margin-top:24px;display:flex;align-items:center;justify-content:center;gap:10px;background:#fff;border:1px solid #D9D6CE;border-radius:9px;padding:14px;font-size:15px;font-weight:700;cursor:pointer\" style-hover=\"border-color:#00417A\">\n        <svg width=\"18\" height=\"18\" sc-camel-view-box=\"0 0 18 18\" aria-hidden=\"true\"><path fill=\"#4285F4\" d=\"M17.6 9.2c0-.6-.1-1.2-.2-1.8H9v3.5h4.8a4.1 4.1 0 0 1-1.8 2.7v2.2h2.9c1.7-1.6 2.7-3.9 2.7-6.6Z\"><\u002Fpath><path fill=\"#34A853\" d=\"M9 18c2.4 0 4.5-.8 6-2.2l-2.9-2.2c-.8.5-1.8.9-3.1.9-2.4 0-4.4-1.6-5.1-3.8H.9v2.3A9 9 0 0 0 9 18Z\"><\u002Fpath><path fill=\"#FBBC05\" d=\"M3.9 10.7a5.4 5.4 0 0 1 0-3.4V5H.9a9 9 0 0 0 0 8l3-2.3Z\"><\u002Fpath><path fill=\"#EA4335\" d=\"M9 3.6c1.3 0 2.5.5 3.4 1.3l2.6-2.6A9 9 0 0 0 .9 5l3 2.3C4.6 5.1 6.6 3.6 9 3.6Z\"><\u002Fpath><\u002Fsvg>\n        Continue with Ontario Tech\n      <\u002Fbutton>\n      <div style=\"font-family:'IBM Plex Mono',monospace;font-size:11px;color:#5A6470;margin-top:14px;line-height:1.6\">ALLOWED DOMAIN · @ONTARIOTECHU.NET<\u002Fdiv>\n      <button sc-camel-on-click=\"{{ closeLogin }}\" style=\"width:100%;margin-top:14px;background:none;border:0;padding:10px;font-size:14px;font-weight:600;color:#3D4855;cursor:pointer\">Cancel<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ reportOpen }}\" hint-placeholder-val=\"{{ false }}\">\n  <div style=\"position:fixed;inset:0;z-index:90;background:rgba(16,21,27,.42);display:grid;place-items:center;padding:24px\">\n    <div role=\"dialog\" aria-modal=\"true\" aria-label=\"Report project\" style=\"width:100%;max-width:440px;background:#fff;border:1px solid #E6E4DE;border-radius:14px;padding:30px;animation:otuRise .22s ease-out\">\n      <h2 style=\"margin:0;font-size:22px;font-weight:800;letter-spacing:-.025em\">Report this project<\u002Fh2>\n      <p style=\"margin:9px 0 0;font-size:14px;color:#3D4855\">Reports go to the moderation queue. Pick a reason.<\u002Fp>\n      <div style=\"display:flex;flex-direction:column;gap:8px;margin-top:20px\">\n        <sc-for list=\"{{ reportReasons }}\" as=\"r\" hint-placeholder-count=\"6\">\n          <button sc-camel-on-click=\"{{ r.pick }}\" style=\"text-align:left;background:{{ r.bg }};border:1px solid {{ r.border }};border-radius:9px;padding:12px 15px;font-size:14.5px;font-weight:600;color:#22303D;cursor:pointer\" style-hover=\"border-color:#00417A\">{{ r.label }}<\u002Fbutton>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <div style=\"display:flex;gap:10px;margin-top:22px\">\n        <button sc-camel-on-click=\"{{ closeReport }}\" style=\"flex:1;background:#fff;border:1px solid #D9D6CE;border-radius:9px;padding:12px;font-size:14.5px;font-weight:700;cursor:pointer\">Cancel<\u002Fbutton>\n        <button sc-camel-on-click=\"{{ submitReport }}\" style=\"flex:1;background:#E2572A;color:#fff;border:0;border-radius:9px;padding:12px;font-size:14.5px;font-weight:700;cursor:pointer\">Submit report<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ rejectOpen }}\" hint-placeholder-val=\"{{ false }}\">\n  <div style=\"position:fixed;inset:0;z-index:90;background:rgba(16,21,27,.42);display:grid;place-items:center;padding:24px\">\n    <div role=\"dialog\" aria-modal=\"true\" aria-label=\"Reject project\" style=\"width:100%;max-width:460px;background:#fff;border:1px solid #E6E4DE;border-radius:14px;padding:30px;animation:otuRise .22s ease-out\">\n      <h2 style=\"margin:0;font-size:22px;font-weight:800;letter-spacing:-.025em\">Reject \"{{ rejectTitle }}\"<\u002Fh2>\n      <p style=\"margin:9px 0 0;font-size:14px;color:#3D4855\">A reason is required and is sent to the student.<\u002Fp>\n      <textarea value=\"{{ rejectReason }}\" sc-camel-on-change=\"{{ setRejectReason }}\" rows=\"4\" placeholder=\"Explain what needs to change...\" style=\"width:100%;margin-top:18px;border:1px solid #D9D6CE;border-radius:9px;padding:13px;font-size:14.5px;outline:none;resize:vertical;line-height:1.55\"><\u002Ftextarea>\n      <div style=\"display:flex;gap:10px;margin-top:18px\">\n        <button sc-camel-on-click=\"{{ closeReject }}\" style=\"flex:1;background:#fff;border:1px solid #D9D6CE;border-radius:9px;padding:12px;font-size:14.5px;font-weight:700;cursor:pointer\">Cancel<\u002Fbutton>\n        <button sc-camel-on-click=\"{{ confirmReject }}\" disabled=\"{{ rejectBlocked }}\" style=\"flex:1;background:{{ rejectBg }};color:#fff;border:0;border-radius:9px;padding:12px;font-size:14.5px;font-weight:700;cursor:{{ rejectCursor }}\">Confirm rejection<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ toastVisible }}\" hint-placeholder-val=\"{{ false }}\">\n  <div role=\"status\" style=\"position:fixed;left:50%;bottom:28px;transform:translateX(-50%);z-index:95;background:#10151B;color:#fff;border-radius:10px;padding:13px 20px;font-size:14.5px;font-weight:600;box-shadow:0 14px 34px rgba(16,21,27,.28);animation:otuRise .2s ease-out\">{{ toast }}<\u002Fdiv>\n<\u002Fsc-if>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;defaultSort&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;Most Upvoted&quot;,&quot;Newest&quot;,&quot;Trending&quot;,&quot;Recently Updated&quot;,&quot;Featured&quot;],&quot;default&quot;:&quot;Most Upvoted&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Behavior&quot;}}\">\nconst BLUE='#00417A', ORANGE='#E2572A';\n\nfunction art(a,b,kind){\n  const w='rgba(255,255,255,.3)';\n  const block=c=>`linear-gradient(${c} 0 0)`;\n  const shapes={\n    orbit:[{img:`radial-gradient(circle at 26% 30%, ${b} 0 12%, transparent 13%)`},{img:`radial-gradient(circle at 72% 64%, rgba(255,255,255,.22) 0 22%, transparent 23%)`}],\n    bars:[\n      {img:block(b),size:'9% 26%',pos:'14% 86%'},\n      {img:block(w),size:'9% 46%',pos:'32% 86%'},\n      {img:block(b),size:'9% 34%',pos:'50% 86%'},\n      {img:block(w),size:'9% 58%',pos:'68% 86%'}],\n    arc:[{img:`radial-gradient(circle at 50% 118%, transparent 0 34%, ${b} 34.5% 39%, transparent 40%)`},{img:`radial-gradient(circle at 50% 118%, transparent 0 52%, rgba(255,255,255,.28) 52.5% 56%, transparent 57%)`}],\n    nodes:[{img:`radial-gradient(circle at 22% 26%, rgba(255,255,255,.34) 0 6%, transparent 7%)`},{img:`radial-gradient(circle at 62% 22%, ${b} 0 5%, transparent 6%)`},{img:`radial-gradient(circle at 78% 70%, rgba(255,255,255,.3) 0 7%, transparent 8%)`},{img:`radial-gradient(circle at 36% 74%, ${b} 0 4%, transparent 5%)`}],\n    stack:[\n      {img:block(b),size:'62% 8%',pos:'18% 28%'},\n      {img:block(w),size:'46% 8%',pos:'18% 50%'},\n      {img:block(b),size:'28% 8%',pos:'18% 72%'}],\n    wave:[{img:`radial-gradient(circle at 10% 90%, rgba(255,255,255,.3) 0 30%, transparent 31%)`},{img:`radial-gradient(circle at 90% 10%, rid of visual markers at stairwells and dead reckoning between them. I also learned that AR interfaces need to show less than you think, because anything on screen competes with the actual hallway.',\n  stack:['React Native','ARKit','ARCore','Python','FastAPI','PostGIS'],\n  implementation:'The client handles tracking and rendering. A FastAPI service holds the campus graph in PostGIS and returns route geometry in a local coordinate frame. Markers at known locations correct accumulated drift, and the phone interpolates between them using the IMU.',\n  architecture:'Three pieces: a mobile client, a routing service, and a marker registry. The registry is a plain table of QR anchors with surveyed positions, which turned out to be the most important and least interesting part of the system.',\n  inspiration:'Airport wayfinding signage and the way transit apps show the next turn rather than the whole route.',\n  future:['Accessible routing that avoids stairs','Crowd-sourced marker registration','Offline campus bundles'],\n  shots:[{caption:'Route overlay, hallway view',kind:'nodes'},{caption:'Destination picker',kind:'stack'},{caption:'Marker calibration mode',kind:'orbit'}],\n  contributors:[{name:'Priya Nandakumar',role:'Routing service',initials:'PN'},{name:'Daniel Kovac',role:'IMU drift correction',initials:'DK'}],\n  comments:[{name:'Marcus Oyelaran',initials:'MO',when:'4 DAYS AGO',body:'Does the drift correction hold up in the ERC basement? Signal is bad down there and the hallways all look identical.'},{name:'Aisha Rahman',initials:'AR',when:'3 DAYS AGO',body:'Holds for about 40m between markers, then it starts sliding. That basement is exactly why the marker registry exists.'}]\n }\n};\n\nconst FILTER_DEFS=[\n {key:'tech',label:'Technology',options:['Technology','React','Python','Go','C++','PyTorch','Next.js','Svelte']},\n {key:'program',label:'Program',options:['Program','Computer Science','Software Engineering','Electrical Engineering','Mechatronics Engineering'
