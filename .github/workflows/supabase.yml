# Validates migrations locally on pull requests and deploys main changes when credentials are configured.

name: Supabase

on:
  push:
    branches: [main]
    paths: ['supabase/**']
  pull_request:
    paths: ['supabase/**']

permissions:
  contents: read

jobs:
  verify:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: supabase db start
      - run: supabase test db
      - name: Confirm migrations leave no undeclared schema drift
        run: supabase db diff --local

  deploy:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - name: Check deployment credentials
        id: credentials
        if: >-
          startsWith(env.SUPABASE_ACCESS_TOKEN, 'sbp_') &&
          env.SUPABASE_DB_PASSWORD != '' &&
          env.SUPABASE_PROJECT_REF != ''
        run: echo "ready=true" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        if: steps.credentials.outputs.ready == 'true'
      - uses: supabase/setup-cli@v1
        if: steps.credentials.outputs.ready == 'true'
        with:
          version: latest
      - run: supabase link --project-ref "$SUPABASE_PROJECT_REF"
        if: steps.credentials.outputs.ready == 'true'
      - run: supabase db push
        if: steps.credentials.outputs.ready == 'true'
